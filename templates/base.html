<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Portafolio{% endblock %}</title>
    <meta name="description" content="Portfolio personal con investigación, proyectos y escritura.">
    <style>
        :root {
            --bg: #f7f3ee;
            --bg-alt: #fffaf4;
            --panel: rgba(255, 255, 255, 0.9);
            --panel-strong: rgba(255, 255, 255, 0.98);
            --line: rgba(124, 90, 56, 0.15);
            --text: #000000;
            --muted: #5a4435;
            --accent: #EDBA84;
            --accent-strong: #e69e58;
            --accent-soft: rgba(237, 186, 132, 0.14);
            --shadow: 0 20px 60px rgba(53, 35, 18, 0.1);
        }

        * { box-sizing: border-box; }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Inter, "Segoe UI", sans-serif;
            background-color: #f6efe8;
            color: var(--text);
            isolation: isolate;
        }

        .flow-field {
            position: fixed;
            inset: 0;
            z-index: -1;
            overflow: hidden;
            pointer-events: none;
        }

        .flow-field svg {
            display: block;
            width: 100%;
            height: 100%;
        }

        .flow-line {
            fill: none;
            stroke: #cf8953;
            stroke-width: 1.5;
            stroke-dasharray: 14 16;
            stroke-linecap: round;
            opacity: 0.23;
            animation: flow-forward 14s linear infinite;
        }

        .flow-line--reverse {
            animation-name: flow-reverse;
            animation-duration: 17s;
        }

        .flow-orbit {
            fill: none;
            stroke: #d98d53;
            stroke-width: 1.3;
            stroke-dasharray: 12 18;
            stroke-linecap: round;
            opacity: 0.2;
            animation: flow-forward 22s linear infinite;
        }

        @keyframes flow-forward {
            to { stroke-dashoffset: -150; }
        }

        @keyframes flow-reverse {
            to { stroke-dashoffset: 150; }
        }

        @media (prefers-reduced-motion: reduce) {
            .flow-line,
            .flow-orbit {
                animation: none;
            }
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        .site-shell {
            max-width: 1220px;
            margin: 0 auto;
            padding: 0 24px 72px;
        }

        .site-header {
            position: sticky;
            top: 0;
            z-index: 10;
            backdrop-filter: blur(16px);
            background: rgba(255, 251, 247, 0.8);
            border-bottom: 1px solid var(--line);
        }

        .topbar {
            max-width: 1220px;
            margin: 0 auto;
            padding: 18px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 24px;
        }

        .brand {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            font-weight: 700;
            letter-spacing: -0.05em;
            font-size: 1.15rem;
            color: var(--text);
        }

        .brand-mark {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            border-radius: 8px;
            background: linear-gradient(135deg, rgba(237, 186, 132, 0.3), rgba(247, 108, 66, 0.14));
            color: var(--accent);
            border: 1px solid rgba(237, 186, 132, 0.32);
            font-size: 0.8rem;
        }

        .brand-portrait {
            width: 28px;
            height: 28px;
            flex: 0 0 28px;
            border: 1px solid rgba(237, 186, 132, 0.45);
            border-radius: 50%;
            object-fit: cover;
        }

        .main-nav {
            display: flex;
            align-items: center;
            gap: 18px;
            color: var(--muted);
            font-size: 0.95rem;
        }

        .main-nav a {
            transition: color 0.2s ease;
        }

        .main-nav a:hover,
        .main-nav a:focus-visible {
            color: var(--text);
        }

        .nav-pill {
            border: 1px solid rgba(237, 186, 132, 0.28);
            background: rgba(237, 186, 132, 0.12);
            color: var(--text);
            padding: 0.7rem 1rem;
            border-radius: 999px;
        }

        @media (max-width: 640px) {
            .topbar {
                flex-direction: column;
                align-items: flex-start;
            }

            .main-nav {
                gap: 12px;
                flex-wrap: wrap;
            }
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>

            <g class="flow-orbit">
                <ellipse cx="300" cy="450" rx="105" ry="72"/>

            <g fill="#d99760" opacity=".28">
                <circle cx="300" cy="450" r="3"/>
                <circle cx="720" cy="450" r="3"/>
                <circle cx="1150" cy="450" r="3"/>
            </g>
        </svg>
    </div>
    <header class="site-header">
        <div class="topbar">
            <a href="{% url 'core:home' %}" class="brand" aria-label="Ir al inicio">
                {% if site_profile.portrait %}
                    <img class="brand-portrait" src="{% url 'core:portrait' %}" alt="">
                {% else %}
                    <span class="brand-mark">P</span>
                {% endif %}
                <span>Portafolio</span>
            </a>
            <nav class="main-nav" aria-label="Navegación principal">
                <a href="{% url 'blog:list' %}">Blog</a>
                <a href="{% url 'research:list' %}">Investigación</a>
                <a href="{% url 'projects:list' %}">Proyectos</a>
                <a href="{% url 'cv:detail' %}">CV</a>
                <a href="{% url 'core:home' %}" class="nav-pill">Inicio</a>
            </nav>
        </div>
    </header>
    <main class="site-shell">{% block content %}{% endblock %}</main>
</body>
</html>
