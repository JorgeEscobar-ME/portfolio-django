services:
  - type: web
    name: portfolio-django
    runtime: python
    buildCommand: bash build.sh
    startCommand: python manage.py migrate --noinput && gunicorn config.wsgi:application
    disk:
      name: portfolio-media
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: portfolio-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: MEDIA_ROOT
        value: /var/data/media

databases:
  - name: portfolio-db
    databaseName: portfolio
    user: portfolio_user